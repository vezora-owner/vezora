<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vezora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>
*{box-sizing:border-box}

:root{
  --bg:#050611;
  --panel:rgba(15,18,38,.72);
  --panel2:rgba(20,24,49,.8);
  --border:rgba(130,120,255,.18);
  --text:#f5f7ff;
  --muted:#9299b8;
  --purple:#765cff;
  --blue:#3ca7ff;
  --green:#27d69a;
}

body{
  margin:0;
  font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(105,75,255,.18),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,150,255,.13),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:45px 45px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  min-height:100vh;
}

/* ---------- LOGO ---------- */

.logo{
  display:flex;
  align-items:center;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}

.logo b{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  margin-right:9px;
  border-radius:11px;
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  box-shadow:0 0 25px rgba(111,91,255,.4);
}

/* ---------- BUTTONS ---------- */

.btn{
  border:0;
  padding:11px 17px;
  border-radius:11px;
  color:white;
  font-weight:750;
  background:linear-gradient(135deg,#6855ff,#398fff);
  box-shadow:0 7px 25px rgba(91,75,255,.22);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(91,75,255,.4);
}

.btn.alt{
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
  box-shadow:none;
}

.btn.green{
  background:linear-gradient(135deg,#18b981,#2bdba4);
}

.btn.danger{
  background:linear-gradient(135deg,#e54b67,#ff657d);
}

/* ---------- AUTH ---------- */

.auth{
  position:relative;
  width:min(430px,calc(100% - 30px));
  margin:9vh auto;
  padding:35px;
  background:rgba(10,13,30,.78);
  backdrop-filter:blur(22px);
  border:1px solid var(--border);
  border-radius:25px;
  box-shadow:0 30px 100px rgba(0,0,0,.45);
  overflow:hidden;
}

.auth:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:#705bff;
  filter:blur(100px);
  opacity:.18;
  top:-80px;
  right:-60px;
}

.auth h1{
  margin:0 0 10px;
}

.auth .logo{
  font-size:28px;
}

.muted{
  color:var(--muted);
}

.field{
  margin:14px 0;
}

.field input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
  transition:.2s;
}

.field input:focus{
  border-color:#7464ff;
  box-shadow:0 0 0 3px rgba(116,100,255,.1);
}

.auth .btn{
  margin-top:5px;
}

/* ---------- TOP BAR ---------- */

.top{
  height:70px;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:rgba(5,6,17,.75);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

/* ---------- DASHBOARD ---------- */

.dash{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 70px);
}

aside{
  padding:18px 13px;
  background:rgba(7,9,22,.65);
  border-right:1px solid var(--border);
}

.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  margin:6px 0;
  padding:13px 14px;
  text-align:left;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:#9ba3c2;
  transition:.2s;
}

.nav button:hover{
  color:white;
  background:rgba(255,255,255,.045);
  border-color:var(--border);
}

.nav button.active{
  color:white;
  background:linear-gradient(135deg,rgba(104,84,255,.35),rgba(49,133,255,.16));
  border-color:rgba(120,105,255,.25);
  box-shadow:inset 0 0 25px rgba(92,74,255,.08);
}

/* ---------- MAIN ---------- */

.main{
  width:100%;
  max-width:1200px;
  padding:30px;
}

.main h2{
  margin-top:0;
  font-size:27px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* ---------- CARDS ---------- */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:25px 0 30px;
}

.card{
  position:relative;
  padding:20px;
  background:var(--panel);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:17px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(120,105,255,.35);
  box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.card b{
  font-size:15px;
}

.card p{
  margin-bottom:0;
}

/* ---------- PEOPLE ---------- */

.suggest{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.person{
  text-align:center;
}

.person small{
  display:block;
  margin:6px 0 13px;
}

.avatar{
  width:52px;
  height:52px;
  margin:0 auto 10px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,#fff 0 4%,transparent 5%),
    linear-gradient(135deg,#f09ac8,#695dff,#39a5ff);
  box-shadow:0 0 20px rgba(104,91,255,.22);
}

/* ---------- CHAT ---------- */

.chat{
  display:grid;
  grid-template-columns:270px 1fr;
  height:600px;
  gap:15px;
}

.list,
.window,
.call{
  background:var(--panel);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.list{
  padding:10px;
  overflow-y:auto;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  margin:3px 0;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.item:hover,
.item.active{
  background:rgba(111,91,255,.13);
}

.item .avatar{
  width:40px;
  height:40px;
  min-width:40px;
  margin:0;
}

.window{
  display:flex;
  flex-direction:column;
}

.head{
  padding:17px;
  font-weight:750;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.02);
}

.msg{
  max-width:70%;
  width:fit-content;
  padding:11px 15px;
  margin:8px 0;
  border-radius:18px 18px 18px 5px;
  background:rgba(25,31,58,.95);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 5px 20px rgba(0,0,0,.12);
  line-height:1.45;
}

.msg.me{
  margin-left:auto;
  background:linear-gradient(135deg,#5b4be0,#397fe8);
  border:0;
  border-radius:18px 18px 5px 18px;
  box-shadow:0 7px 22px rgba(77,70,220,.25);
}

@media(max-width:650px){
  .msg{
    max-width:82%;
  }
}

.compose{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:rgba(5,8,20,.75);
  border-top:1px solid rgba(255,255,255,.07);
}

.compose input{
  flex:1;
  height:46px;
  box-sizing:border-box;
  padding:0 16px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.055);
  color:#fff;
  outline:none;
}

.compose input:focus{
  border-color:rgba(118,92,255,.55);
  box-shadow:0 0 18px rgba(118,92,255,.12);
}

.compose .btn{
  width:48px;
  height:46px;
  padding:0;
  border-radius:15px;
  font-size:18px;
}

.compose input{
  flex:1;
  min-width:0;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
}

.compose input:focus{
  border-color:#6d5cff;
}

/* ---------- CALLS ---------- */

.callgrid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:15px;
}

.call{
  text-align:center;
  padding:30px;
}

.call .avatar{
  width:110px;
  height:110px;
  margin:20px auto;
  box-shadow:0 0 40px rgba(105,88,255,.3);
}

video{
  background:#02030a;
  object-fit:cover;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:900px){

  .dash{
    grid-template-columns:1fr;
  }

  aside{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:20;
    padding:8px;
    background:rgba(5,6,17,.94);
    backdrop-filter:blur(18px);
    border-right:0;
    border-top:1px solid var(--border);
  }

  .nav{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
  }

  .nav button{
    justify-content:center;
    flex-direction:column;
    gap:3px;
    margin:0;
    padding:8px 4px;
    font-size:11px;
    text-align:center;
  }

  .nav button:first-letter{
    font-size:18px;
  }

  .main{
    padding-bottom:90px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .suggest{
    grid-template-columns:repeat(2,1fr);
  }

  .callgrid{
    grid-template-columns:1fr;
  }
}
@media(max-width:650px){

  .top{
    padding:0 14px;
  }

  .main{
    padding:20px 13px;
  }

  .main h2{
    font-size:23px;
  }

  .chat{
    grid-template-columns:1fr;
    height:600px;
  }

  .list{
    display:none;
  }

  .suggest{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .auth{
    padding:27px 20px;
  }

  .msg{
    max-width:82%;
  }
}

.hide{
  display:none!important;
}
  .profile-card{
  text-align:center;
  max-width:420px;
}

.profile-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#6555ff,#399cff);
  font-size:45px;
  overflow:hidden;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
  /* Modern Chat List */
#chatList .item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  margin:6px;
  border-radius:16px;
  cursor:pointer;
  transition:.2s;
}

#chatList .item:hover{
  background:rgba(90,90,255,.15);
  transform:translateX(3px);
}

#chatList .item .avatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,#7564ff,#399cff);
}

#chatList .item b{
  display:block;
  font-size:15px;
}

#chatList .item small{
  display:block;
  margin-top:4px;
  opacity:.65;
}
  .online-dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#22c55e;
  border-radius:50%;
  margin-left:6px;
  box-shadow:0 0 8px #22c55e;
}
  .home-card{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:105px;
  background:
    linear-gradient(145deg,rgba(118,92,255,.14),rgba(60,167,255,.05)),
    var(--panel);
}

.home-icon{
  width:48px;
  height:48px;
  min-width:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,rgba(118,92,255,.28),rgba(60,167,255,.16));
  border:1px solid rgba(130,120,255,.25);
  font-size:23px;
  box-shadow:0 8px 25px rgba(70,70,255,.14);
}

.home-card b{
  display:block;
  margin-bottom:5px;
}
  .home-card{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:105px;
  background:linear-gradient(145deg,rgba(118,92,255,.14),rgba(60,167,255,.05)),var(--panel);
}

.home-icon{
  width:48px;
  height:48px;
  min-width:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,rgba(118,92,255,.28),rgba(60,167,255,.16));
  border:1px solid rgba(130,120,255,.25);
  font-size:23px;
  box-shadow:0 8px 25px rgba(70,70,255,.14);
}

.home-card b{
  display:block;
  margin-bottom:5px;
}
  /* ===== VEZORA CINEMATIC HOME ===== */

.vezora-home{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 35%,#182c70 0%,transparent 28%),
    radial-gradient(circle at 20% 80%,#24145c 0%,transparent 30%),
    #03050d;
  color:#fff;
}

.vz-nav{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:relative;
  z-index:10;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.vz-logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:-1px;
}

.vz-logo span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin-right:8px;
  border-radius:10px;
  background:linear-gradient(135deg,#704cff,#26baff);
  box-shadow:0 0 30px #4b64ff88;
}

.vz-links{
  display:flex;
  gap:38px;
}

.vz-links a{
  color:#929bb7;
  text-decoration:none;
  font-size:14px;
  transition:.3s;
}

.vz-links a:hover{
  color:white;
}

.vz-login{
  padding:11px 22px;
  border:1px solid #5368b8;
  border-radius:30px;
  background:#0b1127;
  color:white;
  cursor:pointer;
}

.vz-hero{
  min-height:calc(100vh - 82px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:40px 8%;
  position:relative;
  z-index:2;
}

.vz-copy{
  max-width:620px;
}

.vz-mini{
  color:#748cff;
  font-size:12px;
  letter-spacing:4px;
  font-weight:bold;
}

.vz-copy h1{
  font-size:clamp(50px,6vw,88px);
  line-height:.98;
  letter-spacing:-5px;
  margin:22px 0;
}

.vz-copy h1 span{
  background:linear-gradient(90deg,#6f5cff,#38bfff);
  -webkit-background-clip:text;
  color:transparent;
}

.vz-desc{
  color:#8993ae;
  font-size:18px;
  line-height:1.7;
  max-width:520px;
}

.vz-buttons{
  display:flex;
  gap:15px;
  margin-top:32px;
}

.vz-primary,
.vz-secondary{
  padding:15px 27px;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
}

.vz-primary{
  border:0;
  color:white;
  background:linear-gradient(100deg,#6652ff,#258eff);
  box-shadow:0 0 35px #4168ff55;
}

.vz-secondary{
  color:white;
  background:#0a1022;
  border:1px solid #29375f;
}

/* PHONE */

.vz-device{
  position:relative;
  width:390px;
  height:600px;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotate(5deg);
}

.phone-glow{
  position:absolute;
  width:330px;
  height:500px;
  background:#3e62ff;
  filter:blur(100px);
  opacity:.25;
}

.phone{
  width:290px;
  height:550px;
  padding:28px 20px;
  border-radius:42px;
  border:1px solid #42568e;
  background:
    linear-gradient(145deg,#111b3a,#060a18);
  box-shadow:
    0 30px 100px #000,
    inset 0 0 40px #526dff15;
  position:relative;
  z-index:2;
}

.phone-top{
  width:90px;
  height:5px;
  border-radius:10px;
  background:#1e2945;
  margin:auto;
}

.phone-head{
  display:flex;
  justify-content:space-between;
  margin-top:28px;
  color:#dce4ff;
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:28px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#805cff,#28a9ff);
  font-size:20px;
  font-weight:bold;
}

.profile small{
  display:block;
  color:#55d99b;
  margin-top:4px;
}

.message{
  max-width:75%;
  padding:12px 14px;
  border-radius:17px;
  margin-top:20px;
  font-size:12px;
}

.message.left{
  background:#151f3c;
  color:#d7def2;
}

.message.right{
  margin-left:auto;
  background:linear-gradient(135deg,#5448d9,#267ee8);
}

.call-card{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:25px;
  padding:13px;
  border-radius:18px;
  background:#111a34;
  border:1px solid #283b70;
}

.call-icon{
  width:35px;
  height:35px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#3e55d8;
}

.call-card small{
  display:block;
  color:#737f9e;
  margin-top:3px;
}

.call-card button{
  margin-left:auto;
  border:0;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#477cff;
  color:white;
}

.typing{
  position:absolute;
  bottom:25px;
  left:20px;
  right:20px;
  height:45px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-radius:18px;
  background:#0c142b;
  color:#66728f;
  font-size:12px;
}

.typing b{
  color:#6088ff;
}

/* GLOW */

.hero-glow{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
}

.glow1{
  width:250px;
  height:250px;
  background:#573bff;
  left:-100px;
  bottom:0;
  opacity:.2;
}

.glow2{
  width:300px;
  height:300px;
  background:#087eff;
  right:-120px;
  top:30%;
  opacity:.15;
}

/* ANIMATION */

.reveal{
  animation:heroText 1.1s cubic-bezier(.16,1,.3,1) both;
}

.reveal-device{
  animation:deviceIn 1.4s cubic-bezier(.16,1,.3,1) both;
  animation-delay:.2s;
}

@keyframes heroText{
  from{
    opacity:0;
    transform:translateY(60px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes deviceIn{
  from{
    opacity:0;
    transform:translateX(100px) rotate(14deg) scale(.85);
  }
  to{
    opacity:1;
    transform:translateX(0) rotate(5deg) scale(1);
  }
}

.vz-scroll{
  position:absolute;
  bottom:25px;
  left:7%;
  color:#68738e;
  font-size:10px;
  letter-spacing:3px;
}

.vz-scroll span{
  display:inline-block;
  width:35px;
  height:1px;
  background:#536cff;
  vertical-align:middle;
  margin-right:10px;
}

/* FEATURES */

.vz-features{
  position:relative;
  z-index:3;
  padding:130px 8%;
  background:linear-gradient(#03050d,#070b1b);
}

.vz-features h2{
  font-size:60px;
  line-height:1;
  letter-spacing:-3px;
}

.vz-features h2 span{
  color:#647dff;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:60px;
}

.feature-card{
  padding:35px;
  min-height:180px;
  border-radius:25px;
  background:linear-gradient(145deg,#0d1530,#080d1d);
  border:1px solid #1d2b50;
  transition:.35s;
}

async function createGroup(name){

  const {data:group,error} = await sb
    .from("chat_groups")
    .insert({
      name:name,
      created_by:me.id
    })
    .select()
    .single();

  if(error){
    console.error(error);
    alert("Group create nahi hua: "+error.message);
    return;
  }

  const {error:memberError} = await sb
    .from("chat_group_members")
    .insert({
      group_id:group.id,
      user_id:me.id
    });

  if(memberError){
    console.error(memberError);
    alert("Group member add nahi hua.");
    return;
  }

  alert("Group created! 🎉");

  console.log("Group:",group);
}

function startPresence(){

  if(!me) return;

  if(presenceChannel)
    sb.removeChannel(presenceChannel);

  presenceChannel=sb
    .channel("vezora-presence")
    .on("presence",{event:"sync"},updateOnlineStatus)
    .on("presence",{event:"join"},updateOnlineStatus)
    .on("presence",{event:"leave"},updateOnlineStatus)
    .subscribe(async status=>{

      if(status==="SUBSCRIBED"){
        await presenceChannel.track({
          online:true
        });
      }

    });
}

function updateOnlineStatus(){

  if(!presenceChannel) return;

  const state=presenceChannel.presenceState();

  document.querySelectorAll("[data-user-id]").forEach(el=>{

    const id=el.dataset.userId;
    const dot=el.querySelector(".online-dot");

    if(!dot) return;

    dot.style.display=state[id] ? "inline-block" : "none";

  });
}
  sb.auth.onAuthStateChange((_e,s)=>{
    me=s?.user||null;
    if(me){
      renderApp();
      startPresence(); }else{
      renderAuth(); }
  });

  sb.auth.getSession().then(({data})=>{
    me=data.session?.user||null;

  renderApp();

}else{

}

  async function loadChats(){

  const {data,error}=await sb
    .from("messages")
    .select("sender_id,receiver_id,body,created_at")
    .or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`)
    .order("created_at",{ascending:false});

  if(error){
    console.error("Chat list error:",error);
    return;
  }

  const last={};
  const ids=[];

  (data||[]).forEach(m=>{
    const id=m.sender_id===me.id ? m.receiver_id : m.sender_id;
    if(!ids.includes(id)){
      ids.push(id);
      last[id]={body:m.body,time:m.created_at,mine:m.sender_id===me.id};
    }
  });

  if(!ids.length){
    $("#chatList").innerHTML=`
      <div class="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <b>No chats yet</b>
        <p>Say hi to someone from People to start a conversation.</p>
      </div>`;
    return;
  }

  const {data:people,error:profileError}=await sb
    .from("profiles")
    .select("id,username,full_name,avatar_url")
    .in("id",ids);

  if(profileError){
    console.error(profileError);
    return;
  }

  people.sort((a,b)=>new Date(last[b.id].time)-new Date(last[a.id].time));

  let seen={};
  try{ seen=JSON.parse(localStorage.getItem("vzSeen")||"{}"); }catch(e){}

  $("#chatList").innerHTML="";

  people.forEach(p=>{

    const L=last[p.id];
    const unread = !L.mine && new Date(L.time) > new Date(seen[p.id]||0);

    const item=document.createElement("div");
    item.className="item"+(unread?" unread":"");
    item.dataset.userId=p.id;
    item.dataset.name=(p.full_name||p.username||"").toLowerCase();

    item.innerHTML=`
      <div class="avatar">
        ${p.avatar_url
          ? `<img src="${esc(p.avatar_url)}"
             style="width:100%;height:100%;border-radius:50%;object-fit:cover">`
          : ""}
        <span class="online-dot"></span>
      </div>

      <div class="item-body">
        <div class="item-top">
          <b>${esc(p.full_name||p.username||"Vezora User")}</b>
          <span class="item-time">${fmtTime(L.time)}</span>
        </div>
        <div class="item-bottom">
          <small class="item-preview">${L.mine?"You: ":""}${esc(L.body||"")}</small>
          ${unread?'<span class="item-dot"></span>':""}
        </div>
      </div>
    `;

    item.onclick=()=>selectPerson(p.id, p.full_name||p.username||"Vezora User");

    $("#chatList").appendChild(item);
  });
}

function fmtTime(iso){
  if(!iso) return "";
  const d=new Date(iso), now=new Date();
  return d.toDateString()===now.toDateString()
    ? d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
    : d.toLocaleDateString([], {day:"2-digit",month:"short"});
}

function filterChats(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll("#chatList .item").forEach(el=>{
    el.style.display = el.dataset.name.includes(q) ? "" : "none";
  });
}

let pc,localStream;

async function startCall(){

  if(!activeUser){
    alert("Select a person first.");
    return;
  }

  pc=new RTCPeerConnection({
    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]
  });

  localStream=
    await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

  $("#local").srcObject=localStream;

  pc.ontrack=e=>{
    $("#remote").srcObject=e.streams[0];
  };

  pc.onicecandidate=e=>{

    if(e.candidate)
      channel?.send({
        type:"broadcast",
        event:"ice",
        payload:e.candidate
      });

  };

  pc.onnegotiationneeded=async()=>{

    let o=await pc.createOffer();

    await pc.setLocalDescription(o);

    channel?.send({
      type:"offer",
      payload:o
    });

  };

  if(channel){

    channel
      .on(
        "broadcast",
        {event:"offer"},
        async p=>{

          await pc.setRemoteDescription(p.payload);

          let a=await pc.createAnswer();

          await pc.setLocalDescription(a);

          channel.send({
            type:"answer",
            payload:a
          });

        }
      )

      .on(
        "broadcast",
        {event:"answer"},
        async p=>
          await pc.setRemoteDescription(p.payload)
      )

      .on(
        "broadcast",
        {event:"ice"},
        async p=>
          pc.addIceCandidate(p.payload)
      );
  }
}

function endCall(){

  localStream?.getTracks().forEach(t=>t.stop());

  pc?.close();

  $("#local").srcObject=null;
  $("#remote").srcObject=null;
}

<script>
/* VEZORA WATER LIGHT v2 */
(function(){
  // Set to false if your computer has "reduce motion / animations off" enabled and you still want the effect
  const RESPECT_REDUCED_MOTION = false;

  if (RESPECT_REDUCED_MOTION && matchMedia("(prefers-reduced-motion: reduce)").matches){
    console.log("Vezora water light: OFF (your system has reduced motion turned on)");
    return;
  }
  if (matchMedia("(hover: none)").matches && matchMedia("(pointer: coarse)").matches){
    console.log("Vezora water light: OFF (touch-only device)");
    return;
  }

  const cv = document.createElement("canvas");
  cv.id = "vzWater";
  cv.style.cssText =
    "position:fixed;top:0;left:0;width:100%;height:100%;" +
    "pointer-events:none;z-index:2147483000;display:block;";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  let W = 0, H = 0;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  const mouse = { x: W / 2, y: H / 2 };

  // r = size of the light, a = brightness
     const trail = [
    { x: mouse.x, y: mouse.y, lag: 24,  r: 170, a: .11 },
    { x: mouse.x, y: mouse.y, lag: 60,  r: 230, a: .07 },
    { x: mouse.x, y: mouse.y, lag: 130, r: 290, a: .04 }
  ];

  const ripples = [];
  let lastSpawn = { x: -999, y: -999, t: 0 };
  let level = 0, target = 0, running = false, prev = 0;

  function spawn(x, y, max, amp, now){
    ripples.push({ x, y, t: now, max, amp });
    if (ripples.length > 16) ripples.shift();
  }

  addEventListener("pointermove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    target = 1;
    const now = performance.now();
    const d = Math.hypot(mouse.x - lastSpawn.x, mouse.y - lastSpawn.y);
    if (d > 36 && now - lastSpawn.t > 70){
            spawn(mouse.x, mouse.y, 150, .18, now);
      lastSpawn = { x: mouse.x, y: mouse.y, t: now };
    }
    kick();
  }, { passive: true });

  addEventListener("pointerdown", e => {
    spawn(e.clientX, e.clientY, 280, .6, performance.now());
    kick();
  }, { passive: true });

  document.addEventListener("mouseleave", () => { target = 0; });
  document.addEventListener("mouseenter", () => { target = 1; kick(); });

  function glow(x, y, r, alpha){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0,  "rgba(255,255,255," + alpha + ")");
    g.addColorStop(.5, "rgba(255,255,255," + (alpha * .35) + ")");
    g.addColorStop(1,  "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function tick(now){
    const dt = Math.min(now - prev, 50);
    prev = now;

    level += (target - level) * (1 - Math.exp(-dt / 220));
    for (const t of trail){
      const f = 1 - Math.exp(-dt / t.lag);
      t.x += (mouse.x - t.x) * f;
      t.y += (mouse.y - t.y) * f;
    }

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    for (const t of trail) glow(t.x, t.y, t.r, t.a * level);

    // shimmer patches drifting around the light
    const s = now / 1000;
    for (let i = 0; i < 6; i++){
      const ang  = s * (.6 + i * .23) + i * 1.7;
      const dist = 40 + 30 * Math.sin(s * (.9 + i * .17) + i);
      const bx = trail[0].x + Math.cos(ang) * dist;
      const by = trail[0].y + Math.sin(ang * 1.13) * dist * .8;
      const br = 30 + 14 * Math.sin(s * 1.3 + i * 2);
      glow(bx, by, br, .07 * level);
    }

    // ripples
    ctx.lineWidth = 1.5;
    for (let i = ripples.length - 1; i >= 0; i--){
      const r = ripples[i];
           const p = Math.max(0, (now - r.t) / 1400);
      if (p >= 1){ ripples.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - p, 3);
      const rad = r.max * e;
      if (rad < 1) continue;
      const a = r.amp * Math.pow(1 - p, 2);
      ctx.strokeStyle = "rgba(255,255,255," + a + ")";
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + (a * .5) + ")";
      ctx.beginPath(); ctx.arc(r.x, r.y, rad * .72, 0, 6.2832); ctx.stroke();
    }

    if (level > .004 || target > 0 || ripples.length){
      requestAnimationFrame(tick);
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  function kick(){
    if (running) return;
    running = true;
    prev = performance.now();
    requestAnimationFrame(tick);
  }

  console.log("Vezora water light: ON");
})();

  <script>
/* VEZORA PINNED SCROLL */
(function(){
  let ticking = false, last = -1;

  function update(){
    ticking = false;
    const root = document.getElementById("vzp");
    if (!root) return;                       // landing page not on screen

    const r = root.getBoundingClientRect();
    const total = r.height - window.innerHeight;
    const p = Math.min(1, Math.max(0, -r.top / total));
    root.style.setProperty("--p", p.toFixed(4));

    const steps   = root.querySelectorAll(".vzp-step");
    const screens = root.querySelectorAll(".vzp-screen");
    const idx = Math.min(steps.length - 1, Math.floor(p * steps.length));
    if (idx === last) return;
    last = idx;

    steps.forEach((el, i) => {
      el.classList.toggle("is-active", i === idx);
      el.classList.toggle("is-past", i < idx);
    });
    screens.forEach((el, i) => el.classList.toggle("is-active", i === idx));
  }

  function onScroll(){
    if (!ticking){ ticking = true; requestAnimationFrame(update); }
  }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll);
  update();
})();

  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const body = document.body;

  /* ================= 1. INTRO ================= */
  let seen = false;
  try { seen = sessionStorage.getItem("vzIntroSeen") === "1"; } catch(e){}
  if (!SHOW_INTRO_EVERY_TIME && seen){ body.classList.add("vz-ready"); }
  else { runIntro(); }

  function runIntro(){
    const ov = document.createElement("div");
    ov.id = "vzIntro";
    ov.innerHTML =
      '<div class="vzi-word">' +
        "VEZORA".split("").map(c => '<span class="vzi-l">' + c + "</span>").join("") +
      '</div>' +
      '<div class="vzi-sub">Connect. Chat. Call.</div>' +
      '<div class="vzi-meta"><div class="vzi-line"><i></i></div><div class="vzi-count">0%</div></div>';
    body.appendChild(ov);
    body.classList.add("vz-intro");
    document.documentElement.style.overflow = "hidden";

    const word = ov.querySelector(".vzi-word");
    const letters = Array.from(ov.querySelectorAll(".vzi-l"));
    const sub = ov.querySelector(".vzi-sub");
    const meta = ov.querySelector(".vzi-meta");
    const bar = ov.querySelector(".vzi-line i");
    const count = ov.querySelector(".vzi-count");
    const t0 = performance.now();
    const LOAD = 2.4, LIFT = 2.75, DUR = 1.05;
    let started = false, finished = false;

    function finish(){
      if (finished) return;
      finished = true;
      ov.remove();
      body.classList.remove("vz-intro");
      body.classList.add("vz-ready");
      document.documentElement.style.overflow = "";
      try { sessionStorage.setItem("vzIntroSeen", "1"); } catch(e){}
    }
    setTimeout(finish, 7500);   // safety: never leave the page locked

    function frame(now){
      if (finished) return;
      const t = (now - t0) / 1000;

      // letters: rise, flip up from below, then ripple as a wave
      letters.forEach((el, i) => {
        const r = easeOut(clamp((t - .15 - i * .09) / .85, 0, 1));
        const amp = 15 * clamp((t - .5) / .9, 0, 1);
        const ph = t * 2.6 - i * .75;
        const y = (1 - r) * 80 + Math.sin(ph) * amp;
        const rot = Math.cos(ph) * amp * .2;
        el.style.opacity = r.toFixed(3);
        el.style.transform =
          "translate3d(0," + y.toFixed(2) + "px,0) rotateX(" + ((1 - r) * -75).toFixed(1) +
          "deg) rotate(" + rot.toFixed(2) + "deg)";
      });
      sub.style.opacity = (clamp((t - 1.3) / .7, 0, 1) * .8).toFixed(3);

      // progress line + counter
      const pr = easeInOut(clamp(t / LOAD, 0, 1));
      bar.style.transform = "scaleX(" + pr.toFixed(4) + ")";
      count.textContent = Math.round(pr * 100) + "%";

      // lift: the word pushes toward you while the curtain slides up
      if (t > LIFT){
        if (!started){
          started = true;
          body.classList.remove("vz-intro");
          body.classList.add("vz-ready");
          document.documentElement.style.overflow = "";
        }
        const k = easeInOut(clamp((t - LIFT) / DUR, 0, 1));
        ov.style.transform = "translate3d(0," + (-k * 100) + "%,0)";
        word.style.transform = "scale(" + (1 + k * .18).toFixed(3) + ")";
        word.style.opacity = (1 - k).toFixed(3);
        meta.style.opacity = clamp(1 - k * 2.5, 0, 1).toFixed(3);
        if (k >= 1){ finish(); return; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ================= 2. POINTER: mouse depth, card tilt, spotlight, magnet ================= */
  let mx = 0, my = 0, mxS = 0, myS = 0;

  document.addEventListener("pointermove", e => {
    mx = (e.clientX / window.innerWidth - .5) * 2;
    my = (e.clientY / window.innerHeight - .5) * 2;

    const c = e.target.closest ? e.target.closest(".card,.vzl-tile") : null;
    if (c){
      const r = c.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      c.style.setProperty("--mx", x + "px");
      c.style.setProperty("--my", y + "px");
      if (c.classList.contains("card")){
        c.style.setProperty("--ry", ((x / r.width - .5) * 10).toFixed(2) + "deg");
        c.style.setProperty("--rx", ((.5 - y / r.height) * 8).toFixed(2) + "deg");
      }
    }

    document.querySelectorAll(".vzl-magnet").forEach(b => {
      const r = b.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      b.style.transform = Math.hypot(dx, dy) < 150
        ? "translate3d(" + (dx * .28).toFixed(1) + "px," + (dy * .28).toFixed(1) + "px,0)"
        : "";
    });
  }, { passive: true });

  document.addEventListener("pointerout", e => {
    const c = e.target.closest ? e.target.closest(".card") : null;
    if (c && !c.contains(e.relatedTarget)){
      c.style.setProperty("--rx", "0deg");
      c.style.setProperty("--ry", "0deg");
    }
  });

  /* ================= 3. LOWER PAGE: tiles reveal ================= */
  const io = ("IntersectionObserver" in window) ? new IntersectionObserver(entries => {
    let n = 0;
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      el.style.transitionDelay = (n++ * 90) + "ms";
      el.classList.add("in");
      io.unobserve(el);
      setTimeout(() => { el.style.transitionDelay = ""; }, 1400);
    });
  }, { threshold: .15 }) : null;

  function observeTiles(){
    document.querySelectorAll(".vzl-tile:not([data-o])").forEach(el => {
      el.dataset.o = "1";
      if (io) io.observe(el); else el.classList.add("in");
    });
  }

  /* word-by-word statement that lights up as you scroll */
  function statement(vh){
    const st = document.querySelector(".vzl-statement");
    if (!st) return;
    if (!st._w){
      const words = st.textContent.trim().split(/\s+/);
      st.innerHTML = words.map(w => '<span class="w">' + w + "</span>").join(" ");
      st._w = Array.from(st.querySelectorAll(".w"));
    }
    const r = st.getBoundingClientRect();
    if (r.bottom < 0 || r.top > vh) return;
    const prog = clamp((vh * .9 - r.top) / (r.height + vh * .35), 0, 1);
    const n = st._w.length;
    st._w.forEach((w, i) => {
      const v = clamp(prog * (n + 2) - i, 0, 1);
      w.style.opacity = (.16 + .84 * v).toFixed(3);
    });
  }

  /* ================= 4. 3D SIDEWAYS SCROLL ================= */
  function init3d(root){
    const stage = root.querySelector(".vz3-stage");
    const panels = Array.from(root.querySelectorAll(".vz3-panel"));
    const titles = panels.map(p => (p.querySelector("h3") || {}).textContent || "");

    // depth particles
    const dots = [];
    for (let i = 0; i < 46; i++){
      const el = document.createElement("i");
      el.className = "vz3-dot";
      const z = -950 + Math.random() * 1150;
      const par = (z + 1000) / 1200;
      el.style.opacity = (.12 + par * .55).toFixed(2);
      stage.insertBefore(el, stage.firstChild);
      dots.push({ el, x: (Math.random() - .5) * 1.5, y: (Math.random() - .5) * 1.3, z, par });
    }

    // step counter
    const cnt = document.createElement("div");
    cnt.className = "vz3-count";
    cnt.innerHTML = "<b>1</b><span>/ " + panels.length + "</span><em></em>";
    stage.appendChild(cnt);

    return {
      panels, titles, dots,
      words: Array.from(root.querySelectorAll(".vz3-word")),
      rings: Array.from(root.querySelectorAll(".vz3-ring")),
      grid: root.querySelector(".vz3-grid"),
      bar: root.querySelector(".vz3-bar i"),
      num: cnt.querySelector("b"),
      ttl: cnt.querySelector("em"),
      cur: -1, idx: -1
    };
  }

  function scene3d(dt, vh, W){
    const root = document.getElementById("vz3");
    if (!root) return;
    if (!root._s) root._s = init3d(root);
    const s = root._s;

    const rect = root.getBoundingClientRect();
    const target = clamp(-rect.top / (rect.height - vh), 0, 1);
    if (rect.bottom < -50 || rect.top > vh + 50){ s.cur = target; return; }

    if (s.cur < 0) s.cur = target;
    s.cur += (target - s.cur) * (1 - Math.exp(-dt / 140));   // the glide
    if (Math.abs(target - s.cur) < .0003) s.cur = target;

    const p = s.cur;
    const N = s.panels.length;
    const f = -.6 + p * (N + .2);
    const spread = W < 700 ? .95 : .62;

    s.panels.forEach((el, i) => {
      const d = i - f, a = Math.abs(d);
      const x = d * W * spread - mxS * 14;
      const z = -a * 260;
      const ry = -d * 36 + mxS * 6;
      const sc = 1 + (1 - Math.min(a, 1)) * .04;
      el.style.opacity = clamp(1.15 - a * .9, 0, 1).toFixed(3);
      el.style.setProperty("--sh", (50 - d * 70).toFixed(1) + "%");
      el.style.transform =
        "translate(-50%,-50%) translate3d(" + x.toFixed(1) + "px," + (myS * -8).toFixed(1) + "px," + z.toFixed(1) +
        "px) rotateY(" + ry.toFixed(2) + "deg) rotateX(" + (-myS * 4).toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")";
    });

    s.words.forEach((el, i) => {
      const d = i - f, a = Math.abs(d);
      el.style.opacity = clamp(1.05 - a * 1.1, 0, 1).toFixed(3);
      el.style.transform = "translate(-50%,-50%) translate3d(" + (d * W * .34 - mxS * 30).toFixed(1) + "px,0,-450px)";
    });

    s.rings.forEach((el, i) => {
      const dir = i % 2 ? -1 : 1;
      el.style.transform =
        "translate(-50%,-50%) translate3d(0,0,-380px) rotateX(" + (72 - p * 22 + i * 4 - myS * 4).toFixed(2) +
        "deg) rotateY(" + (p * 50 * dir + mxS * 5).toFixed(2) +
        "deg) rotateZ(" + (p * (300 + i * 140) * dir).toFixed(2) + "deg)";
    });

    // particles drift up with scroll and shift with the mouse, deeper = slower
    const range = vh * 1.3;
    s.dots.forEach(d => {
      let y = d.y * vh - p * 620 * d.par - myS * 40 * d.par;
      y = ((y + range / 2) % range + range) % range - range / 2;
      const x = d.x * W - mxS * 70 * d.par;
      d.el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px," + d.z.toFixed(0) + "px)";
    });

    if (s.grid) s.grid.style.transform = "translate3d(0," + ((p * 2400) % 60).toFixed(2) + "px,0)";
    if (s.bar) s.bar.style.transform = "scaleX(" + p.toFixed(4) + ")";

    const idx = clamp(Math.round(f), 0, N - 1);
    if (idx !== s.idx){
      s.idx = idx;
      s.num.textContent = idx + 1;
      s.ttl.textContent = s.titles[idx];
    }
  }

  /* ================= MAIN LOOP ================= */
  let last = performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min(now - last, 50);
    last = now;
    const vh = window.innerHeight, W = window.innerWidth;

    mxS += (mx - mxS) * (1 - Math.exp(-dt / 220));
    myS += (my - myS) * (1 - Math.exp(-dt / 220));

    observeTiles();
    statement(vh);
    scene3d(dt, vh, W);
  }
  requestAnimationFrame(loop);
})();
</script>
  <script>
/* VEZORA HERO PHONE: chat that plays itself + 3D mouse tilt */
(function(){
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // smoothed mouse tilt
  let px = 0, py = 0, tx = 0, ty = 0;
  addEventListener("pointermove", e => {
    tx = (e.clientX / innerWidth - .5) * 2;
    ty = (e.clientY / innerHeight - .5) * 2;
  }, { passive: true });
  document.addEventListener("mouseleave", () => { tx = 0; ty = 0; });

  function loop(){
    requestAnimationFrame(loop);
    const ph = document.getElementById("vzph");
    if (!ph) return;                                  // landing page not on screen
    px += (tx - px) * .08;
    py += (ty - py) * .08;
    ph.style.setProperty("--px", px.toFixed(3));
    ph.style.setProperty("--py", py.toFixed(3));
    if (!ph._go){ ph._go = true; start(ph); }         // start the chat once per phone
  }
  requestAnimationFrame(loop);

  async function start(ph){
    const msgs = ph.querySelector("#vzphMsgs");
    const st   = ph.querySelector("#vzphSt");
    const inp  = ph.querySelector("#vzphInput");
    const send = ph.querySelector(".vzph-send");
    const call = ph.querySelector(".vzph-call");
    const live = () => ph.isConnected;
    const wait = async ms => { await sleep(ms); return live(); };

    function trim(){ while (msgs.children.length > 5) msgs.removeChild(msgs.firstChild); }

    function bubble(text, me, stamp){
      const b = document.createElement("div");
      b.className = "vzph-b" + (me ? " me" : "");
      b.appendChild(document.createTextNode(text));
      const em = document.createElement("em");
      em.textContent = stamp + (me ? " " : "");
      if (me){
        const tk = document.createElement("span");
        tk.className = "tk";
        tk.textContent = "✓";
        em.appendChild(tk);
        setTimeout(() => { tk.textContent = "✓✓"; tk.classList.add("rd"); }, 900);
      }
      b.appendChild(em);
      msgs.appendChild(b);
      trim();
      return b;
    }

    function react(b){
      const r = document.createElement("span");
      r.className = "vzph-re";
      r.textContent = "♥";
      b.appendChild(r);
    }

    async function riyaTyping(ms){
      st.textContent = "typing…";
      const t = document.createElement("div");
      t.className = "vzph-b ty";
      t.innerHTML = "<i></i><i></i><i></i>";
      msgs.appendChild(t);
      trim();
      await sleep(ms);
      t.remove();
      st.textContent = "Online";
    }

    async function youType(text){
      inp.classList.add("on");
      inp.textContent = "";
      for (const ch of text){
        if (!live()) return;
        inp.textContent += ch;
        await sleep(45 + Math.random() * 40);
      }
      await sleep(350);
      send.classList.add("go");
      await sleep(150);
      send.classList.remove("go");
      inp.classList.remove("on");
      inp.textContent = "Message";
    }

    // reduced motion: show the finished chat, no animation loop
    if (reduce){
      bubble("Hey! Are you free today?", false, "9:41");
      bubble("Yeah, let's talk!", true, "9:41");
      bubble("Call in 5 minutes?", false, "9:42");
      bubble("Sounds good", true, "9:42");
      return;
    }

    async function cycle(){
      msgs.innerHTML = "";
      call.classList.remove("show");
      st.textContent = "Online";

      if (!await wait(900)) return false;
      await riyaTyping(1100);
      if (!live()) return false;
      bubble("Hey! Are you free today?", false, "9:41");

      if (!await wait(900)) return false;
      await youType("Yeah, let's talk!");
      if (!live()) return false;
      bubble("Yeah, let's talk!", true, "9:41");

      if (!await wait(1000)) return false;
      await riyaTyping(1300);
      if (!live()) return false;
      const ask = bubble("Call in 5 minutes?", false, "9:42");

      if (!await wait(900)) return false;
      await youType("Sounds good");
      if (!live()) return false;
      bubble("Sounds good", true, "9:42");

      if (!await wait(700)) return false;
      react(ask);

      if (!await wait(1100)) return false;
      call.classList.add("show");
      if (!await wait(3400)) return false;
      call.classList.remove("show");

      return await wait(1600);
    }

    while (live()){
      const ok = await cycle();
      if (!ok) break;
    }
  }
})();
</script>
