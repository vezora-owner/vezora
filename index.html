<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vezora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#050b20;color:#eef2ff}button,input{font:inherit}button{cursor:pointer}#app{min-height:100vh}.top{height:64px;border-bottom:1px solid #203054;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#071027}.logo{font-size:21px;font-weight:800}.logo b{display:inline-grid;place-items:center;background:linear-gradient(135deg,#7564ff,#399cff);width:30px;height:30px;border-radius:9px;margin-right:8px}.auth{max-width:420px;margin:10vh auto;padding:30px;background:#0a1430;border:1px solid #27375e;border-radius:18px}.auth h1{margin:0 0 8px}.muted{color:#93a2c4}.field{margin:12px 0}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #293a61;background:#111d3d;color:white}.btn{background:linear-gradient(135deg,#6555ff,#7d5cff);color:white;border:0;padding:11px 16px;border-radius:9px;font-weight:700}.btn.alt{background:#172443;border:1px solid #2a3b62}.dash{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid #203054;padding:16px;background:#071027}.nav button{display:block;width:100%;text-align:left;padding:12px;border:0;background:transparent;color:#9aa9c9;border-radius:8px;margin:4px 0}.nav button.active,.nav button:hover{background:#574bf0;color:white}.main{padding:24px;max-width:1100px;width:100%}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{background:#0b1633;border:1px solid #213258;border-radius:14px;padding:18px}.suggest{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.person{text-align:center}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f19bc3,#6d7aff);margin:0 auto 9px}.chat{display:grid;grid-template-columns:250px 1fr;height:560px;gap:12px}.list,.window,.call{background:#09132e;border:1px solid #203054;border-radius:14px}.list{padding:10px}.item{padding:12px;border-radius:9px;display:flex;gap:9px;align-items:center}.item:hover,.item.active{background:#121f42}.item .avatar{width:38px;height:38px;margin:0}.window{display:flex;flex-direction:column}.head{padding:14px;border-bottom:1px solid #203054}.msgs{flex:1;overflow:auto;padding:15px}.msg{max-width:65%;padding:10px 12px;background:#13203f;border-radius:12px;margin:8px 0}.me{margin-left:auto;background:#4f47d9}.compose{display:flex;gap:8px;padding:10px;border-top:1px solid #203054}.compose input{flex:1;padding:11px;background:#111d3c;color:white;border:1px solid #293a61;border-radius:9px}.callgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.call{text-align:center;padding:30px}.call .avatar{width:100px;height:100px}.danger{background:#e84c62}.green{background:#20b881}.hide{display:none!important}@media(max-width:800px){.dash{grid-template-columns:70px 1fr}aside{padding:8px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.cards,.suggest{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.list{display:none}} </style></head>
<body><div id="app"></div>
<script>
const SUPABASE_URL="https://plujfztigdoupvsqqwyz.supabase.co", SUPABASE_KEY="sb_publishable_FkK9_qjvr7XIge6v0d2QPA_W92WVBjr";
let sb,me,activeUser=null,channel=null;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ready(){return SUPABASE_URL.startsWith("https://")&&!SUPABASE_KEY.includes("PASTE_")}
function auth(){if(!ready()){renderSetup();return}sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);sb.auth.onAuthStateChange((_e,s)=>{me=s?.user||null;me?renderApp():renderAuth()});sb.auth.getSession().then(({data})=>{me=data.session?.user||null;me?renderApp():renderAuth()})}
function renderSetup(){app.innerHTML=`<div class=auth><h1>Vezora is almost ready 🚀</h1><p class=muted>Add your Supabase Project URL and Publishable Key in index.html, then open the file again.</p><p class=muted>These are the two public client values Supabase uses for browser apps; never put a secret/service key here.</p></div>`}
function renderAuth(){app.innerHTML=`<div class=auth><h1><span class=logo><b>V</b>Vezora</span></h1><p class=muted>Connect beyond boundaries.</p><div class=field><input id=email type=email placeholder="Email"></div><div class=field><input id=pass type=password placeholder="Password (6+ characters)"></div><div class=field><input id=name placeholder="Full name (for sign up)"></div><button class=btn onclick=signup()>Create account</button> <button class="btn alt" onclick=login()>Log in</button><p id=err class=muted></p></div>`}
async function signup(){const {data,error}=await sb.auth.signUp({email:$("#email").value,password:$("#pass").value,options:{data:{full_name:$("#name").value}}});$("#err").textContent=error?error.message:"Account created. Check email if confirmation is enabled."}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("#email").value,password:$("#pass").value});if(error)$("#err").textContent=error.message}
async function renderApp(){app.innerHTML=`<header class=top><div class=logo><b>V</b>Vezora</div><button class=btn onclick=logout()>Log out</button></header><div class=dash><aside><div class=nav><button class=active onclick=show("home",this)>🏠 Home</button><button onclick=show("chats",this)>💬 Chats</button><button onclick=show("calls",this)>📞 Calls</button><button onclick=show("people",this)>👥 People</button></div></aside><main class=main><section id=home class="view active"><h2>Welcome 👋</h2><p class=muted>Find people and start connecting.</p><div class=cards><div class=card><b>Your Vezora ID</b><p class=muted id=myid>Loading...</p></div><div class=card><b>Messages</b><p class=muted>Real-time chat</p></div><div class=card><b>Calls</b><p class=muted>Voice/video demo</p></div></div><h3>People You May Know</h3><div id=homePeople class=suggest></div></section><section id=chats class=view><h2>Chats</h2><div class=chat><div id=chatList class=list></div><div class=window><div id=chatHead class=head>Select someone to chat</div><div id=msgs class=msgs></div><form class=compose onsubmit=send(event)><input id=msg placeholder="Type a message..."><button class=btn>➤</button></form></div></div></section><section id=calls class=view><h2>Calls</h2><div class=callgrid><div class=call><p class=muted>Peer-to-peer calling</p><div class=avatar></div><h3 id=callName>No person selected</h3><button class="btn green" onclick=startCall()>Start video call</button><button class="btn danger" onclick=endCall()>End</button><video id=local autoplay muted playsinline style="width:100%;margin-top:15px;border-radius:10px"></video><video id=remote autoplay playsinline style="width:100%;margin-top:10px;border-radius:10px"></video></div><div class=call><p class=muted>Choose a person from People or Chats first.</p></div></div></section><section id=people class=view><h2>People You May Know</h2><div id=peopleGrid class=suggest></div></section></main></div>`;await loadProfile();await loadPeople();await loadChats()}
function show(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));$("#"+id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
async function loadProfile(){let {data}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();if(!data){await sb.from("profiles").insert({id:me.id,username:(me.email.split("@")[0]+"_"+me.id.slice(0,4)).toLowerCase(),full_name:me.user_metadata?.full_name||me.email.split("@")[0]});data=(await sb.from("profiles").select("*").eq("id",me.id).single()).data}$("#myid").textContent="@"+data.username}
async function loadPeople(){let {data}=await sb.from("profiles").select("id,username,full_name").neq("id",me.id).limit(12);const html=(data||[]).map(p=>`<div class="card person"><div class=avatar></div><b>${esc(p.full_name||p.username)}</b><small class=muted>@${esc(p.username)}</small><br><button class="btn" onclick=selectPerson('${p.id}','${esc(p.full_name||p.username)}')>Chat</button></div>`).join("");$("#peopleGrid").innerHTML=html||"<p class=muted>No other users yet.</p>";$("#homePeople").innerHTML=html||"<p class=muted>Create another account to see suggestions.</p>"}
async function loadChats(){let {data}=await sb.from("profiles").select("id,username,full_name").neq("id",me.id).limit(30);$("#chatList").innerHTML=(data||[]).map(p=>`<div class=item onclick=selectPerson('${p.id}','${esc(p.full_name||p.username)}')><div class=avatar></div><div>${esc(p.full_name||p.username)}<small class=muted style="display:block">@${esc(p.username)}</small></div></div>`).join("")}
async function selectPerson(id,name){activeUser={id,name};$("#chatHead").textContent=name;$("#callName").textContent=name;show("chats",document.querySelectorAll(".nav button")[1]);await loadMessages();if(channel)sb.removeChannel(channel);channel=sb.channel("chat:"+[me.id,id].sort().join("_")).on("broadcast",{event:"message"},p=>{if(p.payload.sender_id!==me.id)addMsg(p.payload.text,false)}).subscribe()}
async function loadMessages(){let {data}=await sb.from("messages").select("*").or(`and(sender_id.eq.${me.id},receiver_id.eq.${activeUser.id}),and(sender_id.eq.${activeUser.id},receiver_id.eq.${me.id})`).order("created_at");$("#msgs").innerHTML="";(data||[]).forEach(m=>addMsg(m.body,m.sender_id===me.id))}
function addMsg(t,own){let d=document.createElement("div");d.className="msg "+(own?"me":"");d.textContent=t;$("#msgs").appendChild(d);$("#msgs").scrollTop=$("#msgs").scrollHeight}
async function send(e){e.preventDefault();if(!activeUser||!$("#msg").value.trim())return;let text=$("#msg").value.trim();$("#msg").value="";await sb.from("messages").insert({sender_id:me.id,receiver_id:activeUser.id,body:text});addMsg(text,true);channel?.send({type:"broadcast",event:"message",payload:{sender_id:me.id,text}})}
let pc,localStream;
async function startCall(){if(!activeUser){alert("Select a person first.");return}pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$("#local").srcObject=localStream;pc.ontrack=e=>$("#remote").srcObject=e.streams[0];pc.onicecandidate=e=>{if(e.candidate)channel?.send({type:"broadcast",event:"ice",payload:e.candidate})};pc.onnegotiationneeded=async()=>{let o=await pc.createOffer();await pc.setLocalDescription(o);channel?.send({type:"offer",payload:o})};if(channel){channel.on("broadcast",{event:"offer"},async p=>{await pc.setRemoteDescription(p.payload);let a=await pc.createAnswer();await pc.setLocalDescription(a);channel.send({type:"answer",payload:a})}).on("broadcast",{event:"answer"},async p=>await pc.setRemoteDescription(p.payload)).on("broadcast",{event:"ice"},async p=>pc.addIceCandidate(p.payload));}}
function endCall(){localStream?.getTracks().forEach(t=>t.stop());pc?.close();$("#local").srcObject=null;$("#remote").srcObject=null}
async function logout(){await sb.auth.signOut()}auth();
</script></body></html>
