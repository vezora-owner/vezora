<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vezora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>
*{box-sizing:border-box}

:root{
  --bg:#050611;
  --panel:rgba(15,18,38,.72);
  --panel2:rgba(20,24,49,.8);
  --border:rgba(130,120,255,.18);
  --text:#f5f7ff;
  --muted:#9299b8;
  --purple:#765cff;
  --blue:#3ca7ff;
  --green:#27d69a;
}

body{
  margin:0;
  font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(105,75,255,.18),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,150,255,.13),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:45px 45px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  min-height:100vh;
}

/* ---------- LOGO ---------- */

.logo{
  display:flex;
  align-items:center;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}

.logo b{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  margin-right:9px;
  border-radius:11px;
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  box-shadow:0 0 25px rgba(111,91,255,.4);
}

/* ---------- BUTTONS ---------- */

.btn{
  border:0;
  padding:11px 17px;
  border-radius:11px;
  color:white;
  font-weight:750;
  background:linear-gradient(135deg,#6855ff,#398fff);
  box-shadow:0 7px 25px rgba(91,75,255,.22);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(91,75,255,.4);
}

.btn.alt{
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
  box-shadow:none;
}

.btn.green{
  background:linear-gradient(135deg,#18b981,#2bdba4);
}

.btn.danger{
  background:linear-gradient(135deg,#e54b67,#ff657d);
}

/* ---------- AUTH ---------- */

.auth{
  position:relative;
  width:min(430px,calc(100% - 30px));
  margin:9vh auto;
  padding:35px;
  background:rgba(10,13,30,.78);
  backdrop-filter:blur(22px);
  border:1px solid var(--border);
  border-radius:25px;
  box-shadow:0 30px 100px rgba(0,0,0,.45);
  overflow:hidden;
}

.auth:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:#705bff;
  filter:blur(100px);
  opacity:.18;
  top:-80px;
  right:-60px;
}

.auth h1{
  margin:0 0 10px;
}

.auth .logo{
  font-size:28px;
}

.muted{
  color:var(--muted);
}

.field{
  margin:14px 0;
}

.field input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
  transition:.2s;
}

.field input:focus{
  border-color:#7464ff;
  box-shadow:0 0 0 3px rgba(116,100,255,.1);
}

.auth .btn{
  margin-top:5px;
}

/* ---------- TOP BAR ---------- */

.top{
  height:70px;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:rgba(5,6,17,.75);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

/* ---------- DASHBOARD ---------- */

.dash{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 70px);
}

aside{
  padding:18px 13px;
  background:rgba(7,9,22,.65);
  border-right:1px solid var(--border);
}

.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  margin:6px 0;
  padding:13px 14px;
  text-align:left;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:#9ba3c2;
  transition:.2s;
}

.nav button:hover{
  color:white;
  background:rgba(255,255,255,.045);
  border-color:var(--border);
}

.nav button.active{
  color:white;
  background:linear-gradient(135deg,rgba(104,84,255,.35),rgba(49,133,255,.16));
  border-color:rgba(120,105,255,.25);
  box-shadow:inset 0 0 25px rgba(92,74,255,.08);
}

/* ---------- MAIN ---------- */

.main{
  width:100%;
  max-width:1200px;
  padding:30px;
}

.main h2{
  margin-top:0;
  font-size:27px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* ---------- CARDS ---------- */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:25px 0 30px;
}

.card{
  position:relative;
  padding:20px;
  background:var(--panel);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:17px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(120,105,255,.35);
  box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.card b{
  font-size:15px;
}

.card p{
  margin-bottom:0;
}

/* ---------- PEOPLE ---------- */

.suggest{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.person{
  text-align:center;
}

.person small{
  display:block;
  margin:6px 0 13px;
}

.avatar{
  width:52px;
  height:52px;
  margin:0 auto 10px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,#fff 0 4%,transparent 5%),
    linear-gradient(135deg,#f09ac8,#695dff,#39a5ff);
  box-shadow:0 0 20px rgba(104,91,255,.22);
}

/* ---------- CHAT ---------- */

.chat{
  display:grid;
  grid-template-columns:270px 1fr;
  height:600px;
  gap:15px;
}

.list,
.window,
.call{
  background:var(--panel);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.list{
  padding:10px;
  overflow-y:auto;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  margin:3px 0;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.item:hover,
.item.active{
  background:rgba(111,91,255,.13);
}

.item .avatar{
  width:40px;
  height:40px;
  min-width:40px;
  margin:0;
}

.window{
  display:flex;
  flex-direction:column;
}

.head{
  padding:17px;
  font-weight:750;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.02);
}

.msgs{
  flex:1;
  overflow:auto;
  padding:20px;
}

.msg{
  width:max-content;
  max-width:70%;
  padding:11px 14px;
  margin:9px 0;
  border:1px solid var(--border);
  background:#12172d;
  border-radius:15px 15px 15px 4px;
  line-height:1.4;
}

.me{
  margin-left:auto;
  background:linear-gradient(135deg,#5144d5,#6955e9);
  border-radius:15px 15px 4px 15px;
  border-color:transparent;
}

.compose{
  display:flex;
  gap:9px;
  padding:12px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,.02);
}

.compose input{
  flex:1;
  min-width:0;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
}

.compose input:focus{
  border-color:#6d5cff;
}

/* ---------- CALLS ---------- */

.callgrid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:15px;
}

.call{
  text-align:center;
  padding:30px;
}

.call .avatar{
  width:110px;
  height:110px;
  margin:20px auto;
  box-shadow:0 0 40px rgba(105,88,255,.3);
}

video{
  background:#02030a;
  object-fit:cover;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:900px){

  .dash{
    grid-template-columns:75px 1fr;
  }

  aside{
    padding:10px 7px;
  }

  .nav button{
    justify-content:center;
    padding:13px 5px;
    font-size:0;
  }

  .nav button:first-letter{
    font-size:19px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .suggest{
    grid-template-columns:repeat(2,1fr);
  }

  .callgrid{
    grid-template-columns:1fr;
  }
}

@media(max-width:650px){

  .top{
    padding:0 14px;
  }

  .main{
    padding:20px 13px;
  }

  .main h2{
    font-size:23px;
  }

  .chat{
    grid-template-columns:1fr;
    height:600px;
  }

  .list{
    display:none;
  }

  .suggest{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .auth{
    padding:27px 20px;
  }

  .msg{
    max-width:82%;
  }
}

.hide{
  display:none!important;
}
  .profile-card{
  text-align:center;
  max-width:420px;
}

.profile-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#6555ff,#399cff);
  font-size:45px;
  overflow:hidden;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
  /* Modern Chat List */
#chatList .item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  margin:6px;
  border-radius:16px;
  cursor:pointer;
  transition:.2s;
}

#chatList .item:hover{
  background:rgba(90,90,255,.15);
  transform:translateX(3px);
}

#chatList .item .avatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,#7564ff,#399cff);
}

#chatList .item b{
  display:block;
  font-size:15px;
}

#chatList .item small{
  display:block;
  margin-top:4px;
  opacity:.65;
}
  .online-dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#22c55e;
  border-radius:50%;
  margin-left:6px;
  box-shadow:0 0 8px #22c55e;
}
</style>
</head>

let sb,me,activeUser=null,channel=null,presenceChannel=null;

const $=s=>document.querySelector(s);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));

function ready(){
  return SUPABASE_URL.startsWith("https://")&&!SUPABASE_KEY.includes("PASTE_");
}
function show(id, btn){
  document.querySelectorAll(".view").forEach(v=>{
    v.classList.remove("active");
  });

  const view = document.getElementById(id);
  if(view) view.classList.add("active");

  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.remove("active");
  });

  if(btn) btn.classList.add("active");
}
  function show(id, btn){
  document.querySelectorAll(".view").forEach(v => {
    v.classList.remove("active");
  });

  const view = document.getElementById(id);
  if(view) view.classList.add("active");

  document.querySelectorAll(".nav button").forEach(b => {
    b.classList.remove("active");

  if(btn) btn.classList.add("active");
}
function auth(){

  if(!ready()){
    renderSetup();
    return;
  }

  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function startPresence(){

  if(!me) return;

  if(presenceChannel)
    sb.removeChannel(presenceChannel);

  presenceChannel=sb
    .channel("vezora-presence")
    .on("presence",{event:"sync"},updateOnlineStatus)
    .on("presence",{event:"join"},updateOnlineStatus)
    .on("presence",{event:"leave"},updateOnlineStatus)
    .subscribe(async status=>{

      if(status==="SUBSCRIBED"){
        await presenceChannel.track({
          online:true
        });
      }

    });
}

function updateOnlineStatus(){

  if(!presenceChannel) return;

  const state=presenceChannel.presenceState();

  document.querySelectorAll("[data-user-id]").forEach(el=>{

    const id=el.dataset.userId;
    const dot=el.querySelector(".online-dot");

    if(!dot) return;

    dot.style.display=state[id] ? "inline-block" : "none";

  });
}
  sb.auth.onAuthStateChange((_e,s)=>{
    me=s?.user||null;
    if(me){
      renderApp();
      startPresence(); }else{
      renderAuth(); }
  });

  sb.auth.getSession().then(({data})=>{
    me=data.session?.user||null;
    if(me){
  renderApp();
  startPresence();
}else{
  renderAuth();
}
  });
}

$("#myid").textContent = "@" + (profile?.username || "user");

  async function loadChats(){

  const {data,error}=await sb
    .from("messages")
    .select("sender_id,receiver_id,created_at")
    .or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`)
    .order("created_at",{ascending:false});

  if(error){
    console.error("Chat list error:",error);
    return;
  }

  const ids=[];
   

 (data||[]).forEach(m=>{
  const id=m.sender_id===me.id ? m.receiver_id : m.sender_id;

  if(!ids.includes(id)) ids.push(id);

 
});
  if(!ids.length){
    $("#chatList").innerHTML=
      `<p class="muted" style="padding:15px">No chats yet</p>`;
    return;
  }

  const {data:people,error:profileError}=await sb
    .from("profiles")
    .select("id,username,full_name,avatar_url")
    .in("id",ids);

  if(profileError){
    console.error(profileError);
    return;
  }

  $("#chatList").innerHTML="";

  (people||[]).forEach(p=>{

    const item=document.createElement("div");
    item.className="item";
    item.dataset.userId=p.id;

    item.innerHTML=`
      <div class="avatar">
        ${p.avatar_url
          ? `<img src="${esc(p.avatar_url)}"
             style="width:100%;height:100%;border-radius:50%;object-fit:cover">`

      </div>

      <div>

        <span class="online-dot"></span>
        <small class="muted">@${esc(p.username||"user")}</small>
        
      </div>
    `;

    item.onclick=()=>selectPerson(
      p.id,
      p.full_name||p.username||"Vezora User"
    );

    $("#chatList").appendChild(item);
  });
}

    .neq("id",me.id);

    <div class="card person">

        ${p.avatar_url ? `<img src="${esc(p.avatar_url)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">` : ""}
      </div>

      <b>${esc(p.full_name||p.username||"Vezora User")}</b>

      <small class="muted">
        @${esc(p.username||"user")}
      </small>

      <button class="btn" onclick="selectPerson('${p.id}','${esc(p.full_name||p.username||"Vezora User")}')">
        💬 Chat
      </button>
    </div>
  `).join("");

  $("#peopleGrid").innerHTML=html;
  $("#homePeople").innerHTML=html;
}

async function selectPerson(id,name){

  activeUser={
    id,
    name
  };

  $("#chatHead").textContent=name;
  $("#callName").textContent=name;

  show(
    "chats",
    document.querySelectorAll(".nav button")[1]
  );

  await loadMessages();

  if(channel)
    sb.removeChannel(channel);

  channel=sb
    .channel("chat:"+[me.id,id].sort().join("_"))
    .on(
      "broadcast",
      {event:"message"},
      p=>{
        if(p.payload.sender_id!==me.id)
          addMsg(p.payload.text,false);
      }
    )
    .subscribe();
}

async function loadMessages(){

  let {data}=await sb
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${me.id},receiver_id.eq.${activeUser.id}),and(sender_id.eq.${activeUser.id},receiver_id.eq.${me.id})`
    )
    .order("created_at");

  $("#msgs").innerHTML="";

  (data||[]).forEach(m=>
    addMsg(
      m.body,
      m.sender_id===me.id
    )
  );
}

function addMsg(t,own){

  let d=document.createElement("div");

  d.className="msg "+(own?"me":"");

  d.textContent=t;

  $("#msgs").appendChild(d);

  $("#msgs").scrollTop=$("#msgs").scrollHeight;
}

async function send(e){

  e.preventDefault();

  if(!activeUser||!$("#msg").value.trim())
    return;

  let text=$("#msg").value.trim();

  $("#msg").value="";

  await sb
    .from("messages")
    .insert({
      sender_id:me.id,
      receiver_id:activeUser.id,
      body:text
    });

  addMsg(text,true);

  channel?.send({
    type:"broadcast",
    event:"message",
    payload:{
      sender_id:me.id,
      text
    }
  });
}


/* ---------- VIDEO CALL ---------- */

let pc,localStream;

async function startCall(){

  if(!activeUser){
    alert("Select a person first.");
    return;
  }

  pc=new RTCPeerConnection({
    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]
  });

  localStream=
    await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

  $("#local").srcObject=localStream;

  pc.ontrack=e=>{
    $("#remote").srcObject=e.streams[0];
  };

  pc.onicecandidate=e=>{

    if(e.candidate)
      channel?.send({
        type:"broadcast",
        event:"ice",
        payload:e.candidate
      });

  };

  pc.onnegotiationneeded=async()=>{

    let o=await pc.createOffer();

    await pc.setLocalDescription(o);

    channel?.send({
      type:"offer",
      payload:o
    });

  };

  if(channel){

    channel
      .on(
        "broadcast",
        {event:"offer"},
        async p=>{

          await pc.setRemoteDescription(p.payload);

          let a=await pc.createAnswer();

          await pc.setLocalDescription(a);

          channel.send({
            type:"answer",
            payload:a
          });

        }
      )

      .on(
        "broadcast",
        {event:"answer"},
        async p=>
          await pc.setRemoteDescription(p.payload)
      )

      .on(
        "broadcast",
        {event:"ice"},
        async p=>
          pc.addIceCandidate(p.payload)
      );
  }
}

function endCall(){

  localStream?.getTracks().forEach(t=>t.stop());

  pc?.close();

  $("#local").srcObject=null;
  $("#remote").srcObject=null;
}

async function editProfile(){

  const username=prompt(
    "Enter your username:",
    $("#profileUsername").textContent.replace("@","")
  );

  if(username===null)return;

  const cleanUsername=username.trim().toLowerCase();

  if(!/^[a-z0-9_]{3,20}$/.test(cleanUsername)){
    alert("Username 3-20 characters ka ho. Sirf letters, numbers aur _ allowed hain.");
    return;
  }

  const {data:existing}=await sb
    .from("profiles")
    .select("id")
    .eq("username",cleanUsername)
    .neq("id",me.id)
    .maybeSingle();

  if(existing){
    alert("Ye username already taken hai ❌");
    return;
  }

  const name=prompt(
    "Enter your name:",
    $("#profileName").textContent
  );

  if(name===null)return;

  const bio=prompt(
    "Enter your bio:",
    $("#profileBio").textContent
  );

  if(bio===null)return;

  const {error}=await sb
    .from("profiles")
    .update({
      username:cleanUsername,
      full_name:name.trim(),
      bio:bio.trim()
    })
    .eq("id",me.id);

  if(error){
    alert("Update failed: "+error.message);
    return;
  }

  $("#profileUsername").textContent="@"+cleanUsername;
  $("#profileName").textContent=name.trim();
  $("#profileBio").textContent=bio.trim();

  if($("#myid")){
    $("#myid").textContent="@"+cleanUsername;
  }

  alert("Profile updated ✅");
}

  
async function uploadAvatar(file){
  if(!file)return;

  const ext=file.name.split(".").pop();
  const path=me.id+"."+ext;

  const {error}=await sb.storage
    .from("avatars")
    .upload(path,file,{upsert:true});

  if(error){
    alert("Upload failed: "+error.message);
    return;
  }

  const {data}=sb.storage
    .from("avatars")
    .getPublicUrl(path);

  const url=data.publicUrl+"?t="+Date.now();

  await sb.from("profiles")
    .update({avatar_url:url})
    .eq("id",me.id);

  $("#profileAvatar").innerHTML='<img src="'+url+'">';
  alert("Profile photo updated ✅");
}
