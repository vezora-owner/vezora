<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vezora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>
*{box-sizing:border-box}

:root{
  --bg:#050611;
  --panel:rgba(15,18,38,.72);
  --panel2:rgba(20,24,49,.8);
  --border:rgba(130,120,255,.18);
  --text:#f5f7ff;
  --muted:#9299b8;
  --purple:#765cff;
  --blue:#3ca7ff;
  --green:#27d69a;
}

body{
  margin:0;
  font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(105,75,255,.18),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,150,255,.13),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:45px 45px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  min-height:100vh;
}

/* ---------- LOGO ---------- */

.logo{
  display:flex;
  align-items:center;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}

.logo b{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  margin-right:9px;
  border-radius:11px;
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  box-shadow:0 0 25px rgba(111,91,255,.4);
}

/* ---------- BUTTONS ---------- */

.btn{
  border:0;
  padding:11px 17px;
  border-radius:11px;
  color:white;
  font-weight:750;
  background:linear-gradient(135deg,#6855ff,#398fff);
  box-shadow:0 7px 25px rgba(91,75,255,.22);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(91,75,255,.4);
}

.btn.alt{
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
  box-shadow:none;
}

.btn.green{
  background:linear-gradient(135deg,#18b981,#2bdba4);
}

.btn.danger{
  background:linear-gradient(135deg,#e54b67,#ff657d);
}

/* ---------- AUTH ---------- */

.auth{
  position:relative;
  width:min(430px,calc(100% - 30px));
  margin:9vh auto;
  padding:35px;
  background:rgba(10,13,30,.78);
  backdrop-filter:blur(22px);
  border:1px solid var(--border);
  border-radius:25px;
  box-shadow:0 30px 100px rgba(0,0,0,.45);
  overflow:hidden;
}

.auth:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:#705bff;
  filter:blur(100px);
  opacity:.18;
  top:-80px;
  right:-60px;
}

.auth h1{
  margin:0 0 10px;
}

.auth .logo{
  font-size:28px;
}

.muted{
  color:var(--muted);
}

.field{
  margin:14px 0;
}

.field input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
  transition:.2s;
}

.field input:focus{
  border-color:#7464ff;
  box-shadow:0 0 0 3px rgba(116,100,255,.1);
}

.auth .btn{
  margin-top:5px;
}

/* ---------- TOP BAR ---------- */

.top{
  height:70px;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:rgba(5,6,17,.75);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

/* ---------- DASHBOARD ---------- */

.dash{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 70px);
}

aside{
  padding:18px 13px;
  background:rgba(7,9,22,.65);
  border-right:1px solid var(--border);
}

.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  margin:6px 0;
  padding:13px 14px;
  text-align:left;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:#9ba3c2;
  transition:.2s;
}

.nav button:hover{
  color:white;
  background:rgba(255,255,255,.045);
  border-color:var(--border);
}

.nav button.active{
  color:white;
  background:linear-gradient(135deg,rgba(104,84,255,.35),rgba(49,133,255,.16));
  border-color:rgba(120,105,255,.25);
  box-shadow:inset 0 0 25px rgba(92,74,255,.08);
}

/* ---------- MAIN ---------- */

.main{
  width:100%;
  max-width:1200px;
  padding:30px;
}

.main h2{
  margin-top:0;
  font-size:27px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* ---------- CARDS ---------- */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:25px 0 30px;
}

.card{
  position:relative;
  padding:20px;
  background:var(--panel);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:17px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(120,105,255,.35);
  box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.card b{
  font-size:15px;
}

.card p{
  margin-bottom:0;
}

/* ---------- PEOPLE ---------- */

.suggest{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.person{
  text-align:center;
}

.person small{
  display:block;
  margin:6px 0 13px;
}

.avatar{
  width:52px;
  height:52px;
  margin:0 auto 10px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,#fff 0 4%,transparent 5%),
    linear-gradient(135deg,#f09ac8,#695dff,#39a5ff);
  box-shadow:0 0 20px rgba(104,91,255,.22);
}

/* ---------- CHAT ---------- */

.chat{
  display:grid;
  grid-template-columns:270px 1fr;
  height:600px;
  gap:15px;
}

.list,
.window,
.call{
  background:var(--panel);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.list{
  padding:10px;
  overflow-y:auto;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  margin:3px 0;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.item:hover,
.item.active{
  background:rgba(111,91,255,.13);
}

.item .avatar{
  width:40px;
  height:40px;
  min-width:40px;
  margin:0;
}

.window{
  display:flex;
  flex-direction:column;
}

.head{
  padding:17px;
  font-weight:750;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.02);
}

.msgs{
  flex:1;
  overflow:auto;
  padding:20px;
}

.msg{
  width:max-content;
  max-width:70%;
  padding:11px 14px;
  margin:9px 0;
  border:1px solid var(--border);
  background:#12172d;
  border-radius:15px 15px 15px 4px;
  line-height:1.4;
}

.me{
  margin-left:auto;
  background:linear-gradient(135deg,#5144d5,#6955e9);
  border-radius:15px 15px 4px 15px;
  border-color:transparent;
}

.compose{
  display:flex;
  gap:9px;
  padding:12px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,.02);
}

.compose input{
  flex:1;
  min-width:0;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:rgba(255,255,255,.045);
  color:white;
}

.compose input:focus{
  border-color:#6d5cff;
}

/* ---------- CALLS ---------- */

.callgrid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:15px;
}

.call{
  text-align:center;
  padding:30px;
}

.call .avatar{
  width:110px;
  height:110px;
  margin:20px auto;
  box-shadow:0 0 40px rgba(105,88,255,.3);
}

video{
  background:#02030a;
  object-fit:cover;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:900px){

  .dash{
    grid-template-columns:1fr;
  }

  aside{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:20;
    padding:8px;
    background:rgba(5,6,17,.94);
    backdrop-filter:blur(18px);
    border-right:0;
    border-top:1px solid var(--border);
  }

  .nav{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
  }

  .nav button{
    justify-content:center;
    flex-direction:column;
    gap:3px;
    margin:0;
    padding:8px 4px;
    font-size:11px;
    text-align:center;
  }

  .nav button:first-letter{
    font-size:18px;
  }

  .main{
    padding-bottom:90px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .suggest{
    grid-template-columns:repeat(2,1fr);
  }

  .callgrid{
    grid-template-columns:1fr;
  }
}
@media(max-width:650px){

  .top{
    padding:0 14px;
  }

  .main{
    padding:20px 13px;
  }

  .main h2{
    font-size:23px;
  }

  .chat{
    grid-template-columns:1fr;
    height:600px;
  }

  .list{
    display:none;
  }

  .suggest{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .auth{
    padding:27px 20px;
  }

  .msg{
    max-width:82%;
  }
}

.hide{
  display:none!important;
}
  .profile-card{
  text-align:center;
  max-width:420px;
}

.profile-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#6555ff,#399cff);
  font-size:45px;
  overflow:hidden;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
  /* Modern Chat List */
#chatList .item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  margin:6px;
  border-radius:16px;
  cursor:pointer;
  transition:.2s;
}

#chatList .item:hover{
  background:rgba(90,90,255,.15);
  transform:translateX(3px);
}

#chatList .item .avatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,#7564ff,#399cff);
}

#chatList .item b{
  display:block;
  font-size:15px;
}

#chatList .item small{
  display:block;
  margin-top:4px;
  opacity:.65;
}
  .online-dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#22c55e;
  border-radius:50%;
  margin-left:6px;
  box-shadow:0 0 8px #22c55e;
}
  .home-card{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:105px;
  background:
    linear-gradient(145deg,rgba(118,92,255,.14),rgba(60,167,255,.05)),
    var(--panel);
}

.home-icon{
  width:48px;
  height:48px;
  min-width:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,rgba(118,92,255,.28),rgba(60,167,255,.16));
  border:1px solid rgba(130,120,255,.25);
  font-size:23px;
  box-shadow:0 8px 25px rgba(70,70,255,.14);
}

.home-card b{
  display:block;
  margin-bottom:5px;
}
  .home-card{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:105px;
  background:linear-gradient(145deg,rgba(118,92,255,.14),rgba(60,167,255,.05)),var(--panel);
}

.home-icon{
  width:48px;
  height:48px;
  min-width:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,rgba(118,92,255,.28),rgba(60,167,255,.16));
  border:1px solid rgba(130,120,255,.25);
  font-size:23px;
  box-shadow:0 8px 25px rgba(70,70,255,.14);
}

.home-card b{
  display:block;
  margin-bottom:5px;
}
  /* ===== VEZORA CINEMATIC HOME ===== */

.vezora-home{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 35%,#182c70 0%,transparent 28%),
    radial-gradient(circle at 20% 80%,#24145c 0%,transparent 30%),
    #03050d;
  color:#fff;
}

.vz-nav{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:relative;
  z-index:10;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.vz-logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:-1px;
}

.vz-logo span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin-right:8px;
  border-radius:10px;
  background:linear-gradient(135deg,#704cff,#26baff);
  box-shadow:0 0 30px #4b64ff88;
}

.vz-links{
  display:flex;
  gap:38px;
}

.vz-links a{
  color:#929bb7;
  text-decoration:none;
  font-size:14px;
  transition:.3s;
}

.vz-links a:hover{
  color:white;
}

.vz-login{
  padding:11px 22px;
  border:1px solid #5368b8;
  border-radius:30px;
  background:#0b1127;
  color:white;
  cursor:pointer;
}

.vz-hero{
  min-height:calc(100vh - 82px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:40px 8%;
  position:relative;
  z-index:2;
}

.vz-copy{
  max-width:620px;
}

.vz-mini{
  color:#748cff;
  font-size:12px;
  letter-spacing:4px;
  font-weight:bold;
}

.vz-copy h1{
  font-size:clamp(50px,6vw,88px);
  line-height:.98;
  letter-spacing:-5px;
  margin:22px 0;
}

.vz-copy h1 span{
  background:linear-gradient(90deg,#6f5cff,#38bfff);
  -webkit-background-clip:text;
  color:transparent;
}

.vz-desc{
  color:#8993ae;
  font-size:18px;
  line-height:1.7;
  max-width:520px;
}

.vz-buttons{
  display:flex;
  gap:15px;
  margin-top:32px;
}

.vz-primary,
.vz-secondary{
  padding:15px 27px;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
}

.vz-primary{
  border:0;
  color:white;
  background:linear-gradient(100deg,#6652ff,#258eff);
  box-shadow:0 0 35px #4168ff55;
}

.vz-secondary{
  color:white;
  background:#0a1022;
  border:1px solid #29375f;
}

/* PHONE */

.vz-device{
  position:relative;
  width:390px;
  height:600px;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotate(5deg);
}

.phone-glow{
  position:absolute;
  width:330px;
  height:500px;
  background:#3e62ff;
  filter:blur(100px);
  opacity:.25;
}

.phone{
  width:290px;
  height:550px;
  padding:28px 20px;
  border-radius:42px;
  border:1px solid #42568e;
  background:
    linear-gradient(145deg,#111b3a,#060a18);
  box-shadow:
    0 30px 100px #000,
    inset 0 0 40px #526dff15;
  position:relative;
  z-index:2;
}

.phone-top{
  width:90px;
  height:5px;
  border-radius:10px;
  background:#1e2945;
  margin:auto;
}

.phone-head{
  display:flex;
  justify-content:space-between;
  margin-top:28px;
  color:#dce4ff;
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:28px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#805cff,#28a9ff);
  font-size:20px;
  font-weight:bold;
}

.profile small{
  display:block;
  color:#55d99b;
  margin-top:4px;
}

.message{
  max-width:75%;
  padding:12px 14px;
  border-radius:17px;
  margin-top:20px;
  font-size:12px;
}

.message.left{
  background:#151f3c;
  color:#d7def2;
}

.message.right{
  margin-left:auto;
  background:linear-gradient(135deg,#5448d9,#267ee8);
}

.call-card{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:25px;
  padding:13px;
  border-radius:18px;
  background:#111a34;
  border:1px solid #283b70;
}

.call-icon{
  width:35px;
  height:35px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#3e55d8;
}

.call-card small{
  display:block;
  color:#737f9e;
  margin-top:3px;
}

.call-card button{
  margin-left:auto;
  border:0;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#477cff;
  color:white;
}

.typing{
  position:absolute;
  bottom:25px;
  left:20px;
  right:20px;
  height:45px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-radius:18px;
  background:#0c142b;
  color:#66728f;
  font-size:12px;
}

.typing b{
  color:#6088ff;
}

/* GLOW */

.hero-glow{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
}

.glow1{
  width:250px;
  height:250px;
  background:#573bff;
  left:-100px;
  bottom:0;
  opacity:.2;
}

.glow2{
  width:300px;
  height:300px;
  background:#087eff;
  right:-120px;
  top:30%;
  opacity:.15;
}

/* ANIMATION */

.reveal{
  animation:heroText 1.1s cubic-bezier(.16,1,.3,1) both;
}

.reveal-device{
  animation:deviceIn 1.4s cubic-bezier(.16,1,.3,1) both;
  animation-delay:.2s;
}

@keyframes heroText{
  from{
    opacity:0;
    transform:translateY(60px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes deviceIn{
  from{
    opacity:0;
    transform:translateX(100px) rotate(14deg) scale(.85);
  }
  to{
    opacity:1;
    transform:translateX(0) rotate(5deg) scale(1);
  }
}

.vz-scroll{
  position:absolute;
  bottom:25px;
  left:7%;
  color:#68738e;
  font-size:10px;
  letter-spacing:3px;
}

.vz-scroll span{
  display:inline-block;
  width:35px;
  height:1px;
  background:#536cff;
  vertical-align:middle;
  margin-right:10px;
}

/* FEATURES */

.vz-features{
  position:relative;
  z-index:3;
  padding:130px 8%;
  background:linear-gradient(#03050d,#070b1b);
}

.vz-features h2{
  font-size:60px;
  line-height:1;
  letter-spacing:-3px;
}

.vz-features h2 span{
  color:#647dff;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:60px;
}

.feature-card{
  padding:35px;
  min-height:180px;
  border-radius:25px;
  background:linear-gradient(145deg,#0d1530,#080d1d);
  border:1px solid #1d2b50;
  transition:.35s;
}

.feature-card:hover{
  transform:translateY(-10px);
  border-color:#536dff;
  box-shadow:0 20px 60px #263bff22;
}

.feature-icon{
  font-size:30px;
}

.feature-card h3{
  font-size:23px;
}

.feature-card p{
  color:#7d89a7;
  line-height:1.6;
}

/* MOBILE */

@media(max-width:850px){

  .vz-links{
    display:none;
  }

  .vz-hero{
    flex-direction:column;
    text-align:center;
    padding-top:70px;
  }

  .vz-copy h1{
    font-size:55px;
    letter-spacing:-3px;
  }

  .vz-desc{
    margin:auto;
  }

  .vz-buttons{
    justify-content:center;
  }

  show(
    "chats",
    document.querySelectorAll(".nav button")[1]
  );

  await loadMessages();

  if(channel)
    sb.removeChannel(channel);

  channel=sb
    .channel("chat:"+[me.id,id].sort().join("_"))
    .on(
      "broadcast",
      {event:"message"},
      p=>{
        if(p.payload.sender_id!==me.id)
          addMsg(p.payload.text,false);
      }
    )
    .subscribe();
}

async function loadMessages(){

  let {data}=await sb
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${me.id},receiver_id.eq.${activeUser.id}),and(sender_id.eq.${activeUser.id},receiver_id.eq.${me.id})`
    )
    .order("created_at");

  $("#msgs").innerHTML="";

  (data||[]).forEach(m=>
    addMsg(
      m.body,
      m.sender_id===me.id
    )
  );
}

function addMsg(t,own){

  let d=document.createElement("div");

  d.className="msg "+(own?"me":"");

  d.textContent=t;

  $("#msgs").appendChild(d);

  $("#msgs").scrollTop=$("#msgs").scrollHeight;
}

async function send(e){

  e.preventDefault();

  if(!activeUser||!$("#msg").value.trim())
    return;

  let text=$("#msg").value.trim();

  $("#msg").value="";

  await sb
    .from("messages")
    .insert({
      sender_id:me.id,
      receiver_id:activeUser.id,
      body:text
    });

  addMsg(text,true);

  channel?.send({
    type:"broadcast",
    event:"message",
    payload:{
      sender_id:me.id,
      text
    }
  });
}


/* ---------- VIDEO CALL ---------- */

let pc,localStream;

async function startCall(){

  if(!activeUser){
    alert("Select a person first.");
    return;
  }

  pc=new RTCPeerConnection({
    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]
  });

  localStream=
    await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

  $("#local").srcObject=localStream;

  pc.ontrack=e=>{
    $("#remote").srcObject=e.streams[0];
  };

  pc.onicecandidate=e=>{

    if(e.candidate)
      channel?.send({
        type:"broadcast",
        event:"ice",
        payload:e.candidate
      });

  };

  pc.onnegotiationneeded=async()=>{

    let o=await pc.createOffer();

    await pc.setLocalDescription(o);

    channel?.send({
      type:"offer",
      payload:o
    });

  };

  if(channel){

    channel
      .on(
        "broadcast",
        {event:"offer"},
        async p=>{

          await pc.setRemoteDescription(p.payload);

          let a=await pc.createAnswer();

          await pc.setLocalDescription(a);

          channel.send({
            type:"answer",
            payload:a
          });

        }
      )

      .on(
        "broadcast",
        {event:"answer"},
        async p=>
          await pc.setRemoteDescription(p.payload)
      )

      .on(
        "broadcast",
        {event:"ice"},
        async p=>
          pc.addIceCandidate(p.payload)
      );
  }
}

function endCall(){

  localStream?.getTracks().forEach(t=>t.stop());

  pc?.close();

  $("#local").srcObject=null;
  $("#remote").srcObject=null;
}

async function logout(){

  await sb.auth.signOut();
}
async function editProfile(){

  const username=prompt(
    "Enter your username:",
    $("#profileUsername").textContent.replace("@","")
  );

  if(username===null)return;

  const cleanUsername=username.trim().toLowerCase();

  if(!/^[a-z0-9_]{3,20}$/.test(cleanUsername)){
    alert("Username 3-20 characters ka ho. Sirf letters, numbers aur _ allowed hain.");
    return;
  }

  const {data:existing}=await sb
    .from("profiles")
    .select("id")
    .eq("username",cleanUsername)
    .neq("id",me.id)
    .maybeSingle();

  if(existing){
    alert("Ye username already taken hai ❌");
    return;
  }

  const name=prompt(
    "Enter your name:",
    $("#profileName").textContent
  );

  if(name===null)return;

  const bio=prompt(
    "Enter your bio:",
    $("#profileBio").textContent
  );

  if(bio===null)return;

  const {error}=await sb
    .from("profiles")
    .update({
      username:cleanUsername,
      full_name:name.trim(),
      bio:bio.trim()
    })
    .eq("id",me.id);

  if(error){
    alert("Update failed: "+error.message);
    return;
  }

  $("#profileUsername").textContent="@"+cleanUsername;
  $("#profileName").textContent=name.trim();
  $("#profileBio").textContent=bio.trim();

  if($("#myid")){
    $("#myid").textContent="@"+cleanUsername;
  }

  alert("Profile updated ✅");
}

  
async function uploadAvatar(file){
  if(!file)return;

  const ext=file.name.split(".").pop();
  const path=me.id+"."+ext;

  const {error}=await sb.storage
    .from("avatars")
    .upload(path,file,{upsert:true});

  if(error){
    alert("Upload failed: "+error.message);
    return;
  }

  const {data}=sb.storage
    .from("avatars")
    .getPublicUrl(path);

  const url=data.publicUrl+"?t="+Date.now();

  await sb.from("profiles")
    .update({avatar_url:url})
    .eq("id",me.id);

  $("#profileAvatar").innerHTML='<img src="'+url+'">';
  alert("Profile photo updated ✅");
}
